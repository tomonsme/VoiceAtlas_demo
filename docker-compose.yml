services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-voiceatlas}
      POSTGRES_USER: ${POSTGRES_USER:-voiceatlas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voiceatlas_password}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - voiceatlas_pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-voiceatlas} -d ${POSTGRES_DB:-voiceatlas}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: ./app
    environment:
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-postgresql://voiceatlas:voiceatlas_password@db:5432/voiceatlas}
      BASIC_AUTH_ENABLED: ${BASIC_AUTH_ENABLED:-true}
      BASIC_AUTH_USERNAME: ${BASIC_AUTH_USERNAME:?Set BASIC_AUTH_USERNAME in .env}
      BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD:?Set BASIC_AUTH_PASSWORD in .env}
      BASIC_AUTH_REALM: ${BASIC_AUTH_REALM:-VoiceAtlas Test}
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://app:3000
    restart: unless-stopped
    depends_on:
      - app

volumes:
  voiceatlas_pgdata:
